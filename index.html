<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For Mela 💌</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --pink1:#ff758c;
    --pink2:#ff7eb3;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    height:100vh;
    overflow:hidden;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    -webkit-tap-highlight-color: transparent;
}

/* VIDEO BACKGROUND */

#bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    opacity:0;
    transition:1.5s ease;
}

/* DARK OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:-2;
    opacity:0;
    transition:1.5s;
}

/* GLOW */

body::before{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    filter:blur(60px);
    animation:pulse 7s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

/* HEARTS */

#heart-bg{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:0;
}

.heart{
    position:absolute;
    opacity:0.7;
    animation:fall linear forwards;
    will-change:transform;
}

@keyframes fall{
    from{
        transform:translateY(-10vh) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

/* ENVELOPE */

.envelope-wrapper{
    position:relative;
    width:300px;
    height:210px;
    background:white;
    border-radius:0 0 15px 15px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
    cursor:pointer;
    z-index:5;
    transition:0.4s;
    animation:shake 3s infinite;
}

.envelope-wrapper:hover{
    transform:scale(1.03);
}

@keyframes shake{
    0%,100%{transform:rotate(0);}
    25%{transform:rotate(1deg);}
    75%{transform:rotate(-1deg);}
}

.envelope-wrapper::before{
    content:'';
    position:absolute;
    top:0;

    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-top:110px solid #f1f1f1;

    transform-origin:top;
    transition:0.8s ease;

    z-index:5;
}

.envelope-wrapper.open::before{
    transform:rotateX(180deg);
}

/* LETTER */

.letter{
    position:absolute;
    width:85%;
    height:85%;
    background:white;
    left:7.5%;
    top:10px;
    border-radius:12px;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
    transition:0.8s;
}

.envelope-wrapper.open .letter{
    transform:translateY(-100px);
}

.letter h2{
    color:var(--pink1);
    margin-bottom:10px;
}

.tap-text{
    position:absolute;
    width:100%;
    bottom:-35px;
    text-align:center;
    color:white;
    font-size:13px;
}

/* SECRET PAGE */

#secret-content{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:50;
    padding:25px;
    animation:fade 1s;
}

@keyframes fade{
    from{opacity:0;}
    to{opacity:1;}
}

.title{
    color:white;
    font-size:2rem;
    margin-bottom:20px;
    text-align:center;
    text-shadow:0 0 10px rgba(0,0,0,0.4);
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

/* PHOTO */

.photo-frame{
    width:210px;
    height:210px;
    background:white;
    padding:8px;
    border-radius:18px;
    margin-bottom:20px;
    transform:rotate(-2deg);
}

.photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:12px;
}

/* TYPING */

#typing-text{
    color:white;
    max-width:340px;
    text-align:center;
    line-height:1.8;
    font-size:14

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For Mela 💌</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --pink1:#ff758c;
    --pink2:#ff7eb3;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,var(--pink1),var(--pink2));
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    -webkit-tap-highlight-color: transparent;
}

/* GLOW */

body::before{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    filter:blur(60px);
    animation:pulse 7s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

/* HEARTS */

#heart-bg{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:0;
}

.heart{
    position:absolute;
    opacity:0.7;
    animation:fall linear forwards;
    will-change:transform;
}

@keyframes fall{
    from{
        transform:translateY(-10vh) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

/* ENVELOPE */

.envelope-wrapper{
    position:relative;
    width:300px;
    height:210px;
    background:white;
    border-radius:0 0 15px 15px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
    cursor:pointer;
    z-index:5;
    transition:0.4s;
    animation:shake 3s infinite;
}

.envelope-wrapper:hover{
    transform:scale(1.03);
}

@keyframes shake{
    0%,100%{transform:rotate(0);}
    25%{transform:rotate(1deg);}
    75%{transform:rotate(-1deg);}
}

.envelope-wrapper::before{
    content:'';
    position:absolute;
    top:0;

    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-top:110px solid #f1f1f1;

    transform-origin:top;
    transition:0.8s ease;

    z-index:5;
}

.envelope-wrapper.open::before{
    transform:rotateX(180deg);
}

/* LETTER */

.letter{
    position:absolute;
    width:85%;
    height:85%;
    background:white;
    left:7.5%;
    top:10px;
    border-radius:12px;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
    transition:0.8s;
}

.envelope-wrapper.open .letter{
    transform:translateY(-100px);
}

.letter h2{
    color:var(--pink1);
    margin-bottom:10px;
}

.tap-text{
    position:absolute;
    width:100%;
    bottom:-35px;
    text-align:center;
    color:white;
    font-size:13px;
}

/* SECRET PAGE */

#secret-content{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:50;
    padding:25px;
    animation:fade 1s;
}

@keyframes fade{
    from{opacity:0;}
    to{opacity:1;}
}

.title{
    color:white;
    font-size:2rem;
    margin-bottom:20px;
    text-align:center;
    text-shadow:0 0 10px rgba(0,0,0,0.4);
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

/* PHOTO */

.photo-frame{
    width:210px;
    height:210px;
    background:white;
    padding:8px;
    border-radius:18px;
    margin-bottom:20px;
    transform:rotate(-2deg);
}

.photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:12px;
}

/* TYPING */

#typing-text{
    color:white;
    max-width:340px;
    text-align:center;
    line-height:1.8;
    font-size:14px;
    min-height:180px;
    text-shadow:0 0 10px rgba(0,0,0,0.4);
}

/* GALLERY */

.gallery{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-top:20px;
    max-width:90%;
    padding-bottom:10px;
}

.gallery img{
    width:110px;
    height:145px;
    object-fit:cover;
    border-radius:14px;
    border:2px solid white;
}

/* LOVE BUTTONS */

#love-container{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
}

.love-btn{
    position:absolute;
    padding:9px 16px;
    border:none;
    border-radius:999px;
    background:white;
    color:#ff758c;
    font-weight:600;
    cursor:pointer;
    pointer-events:auto;
    animation:popIn 0.4s ease;
}

@keyframes popIn{
    from{
        transform:scale(0);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* BUTTON */

.btn{
    margin-top:25px;
    border:none;
    padding:11px 25px;
    border-radius:999px;
    background:white;
    color:#ff758c;
    font-weight:600;
    cursor:pointer;
}

</style>
</head>
<body>

<!-- MUSIC -->
<audio id="bg-music" loop>
    <source src="Ini Abadi Perunggu.m4a" type="audio/mp4">
</audio>

<!-- HEARTS -->
<div id="heart-bg"></div>

<!-- ENVELOPE -->
<div class="envelope-wrapper" id="envelope">

    <div class="letter">
        <h2>Untuk Mela 💌</h2>
        <p>klik lagi buat buka isi hati aku ✨</p>
    </div>

    <div class="tap-text">
        tap amplopnya sayang 🤍
    </div>

</div>

<!-- SECRET -->
<div id="secret-content">

    <h1 class="title">
        Happy Level Up Sayangku 🎂
    </h1>

    <div class="photo-frame">
        <img src="IMG-20260407-WA0017.jpg">
    </div>

    <p id="typing-text"></p>

    <div class="gallery">
        <img src="IMG-20260426-WA0050.jpg">
        <img src="IMG-20260415-WA0009.jpg">
        <img src="IMG-20260407-WA0017.jpg">
    </div>

    <button class="btn" onclick="location.reload()">
        Replay 💞
    </button>

</div>

<div id="love-container"></div>

<!-- CONFETTI -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* HEARTS */

function createHeart(){

    const heart = document.createElement('div');

    heart.classList.add('heart');

    const emojis = ['💖','💕','💞'];

    heart.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];

    heart.style.left = Math.random()*100 + 'vw';

    heart.style.fontSize = Math.random()*15 + 15 + 'px';

    heart.style.animationDuration = Math.random()*3 + 4 + 's';

    document.getElementById('heart-bg').appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);

}

setInterval(createHeart,500);

/* ENVELOPE */

const envelope = document.getElementById('envelope');

let opened = false;

envelope.addEventListener('click',()=>{

    const music = document.getElementById('bg-music');

    music.currentTime = 33;

    music.play();

    if(!opened){

        envelope.classList.add('open');

        opened = true;

    }else{

        document.getElementById('secret-content').style.display='flex';

        startTyping();

        confetti({
            particleCount:120,
            spread:100,
            origin:{y:0.6}
        });

        setInterval(createLoveButton,2500);

    }

});

/* TYPING */

const message = `
Happy level up sayangku cintaku 💞

Ga kerasa ya sekarang kamu udah 21.
Makasih udah bertahan sejauh ini,
udah jadi orang baik buat banyak orang,
dan udah hadir di hidup aku.

Aku harap di umur yang baru ini,
hal-hal baik makin sering dateng ke kamu.
Semoga semua yang kamu cari pelan-pelan ketemu,
dan semua sedih yang pernah lewat bisa terganti
sama bahagia yang lebih besar.

Please keep smiling,
because your smile still becomes
one of my favorite things in this world 🤍
`;

let i = 0;

function startTyping(){

    const typingText = document.getElementById('typing-text');

    function typing(){

        if(i < message.length){

            typingText.innerHTML += message.charAt(i);

            i++;

            setTimeout(typing,40);

        }

    }

    typing();

}

/* RANDOM LOVE BUTTONS */

function createLoveButton(){

    const btn = document.createElement('button');

    btn.classList.add('love-btn');

    const texts = [
        'I Love You 💖',
        'Sayangkuu 🤍',
        'My bini',
        'Mwah 😚'
    ];

    btn.innerHTML = texts[Math.floor(Math.random()*texts.length)];

    btn.style.left = Math.random()*75 + 'vw';

    btn.style.top = Math.random()*75 + 'vh';

    document.getElementById('love-container').appendChild(btn);

    btn.addEventListener('click',()=>{

        confetti({
            particleCount:40,
            spread:80
        });

        btn.innerHTML = '💖';

        setTimeout(()=>{
            btn.remove();
        },400);

    });

    setTimeout(()=>{
        btn.remove();
    },4500);

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Special Gift For Mela 💌</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --pink1:#ff758c;
    --pink2:#ff7eb3;
    --dark:#1e1e1e;
    --white:#fff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,var(--pink1),var(--pink2));
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Glow Background */

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(255,255,255,0.12);
    border-radius:50%;
    filter:blur(100px);
    animation:pulse 6s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.3);}
    100%{transform:scale(1);}
}

/* Floating Hearts */

#heart-bg{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:0;
}

.heart{
    position:absolute;
    font-size:20px;
    animation:fall linear forwards;
    opacity:0.7;
}

@keyframes fall{
    from{
        transform:translateY(-10vh) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

/* Envelope */

.envelope-wrapper{
    position:relative;
    width:320px;
    height:220px;
    background:#fff;
    border-radius:0 0 15px 15px;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
    cursor:pointer;
    z-index:5;
    transition:0.4s;
    animation:shake 2s infinite;
}

.envelope-wrapper:hover{
    transform:scale(1.05) rotate(-2deg);
}

@keyframes shake{
    0%,100%{transform:rotate(0);}
    25%{transform:rotate(1deg);}
    75%{transform:rotate(-1deg);}
}

/* Top Envelope */

.envelope-wrapper::before{
    content:'';
    position:absolute;
    top:0;
    z-index:5;

    border-left:160px solid transparent;
    border-right:160px solid transparent;
    border-top:120px solid #f1f1f1;

    transform-origin:top;
    transition:0.8s ease;
}

.envelope-wrapper.open::before{
    transform:rotateX(180deg);
    z-index:1;
}

/* Letter */

.letter{
    position:absolute;
    width:85%;
    height:85%;
    background:white;
    left:7.5%;
    top:10px;
    border-radius:10px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    transition:0.8s;
    z-index:2;
}

.envelope-wrapper.open .letter{
    transform:translateY(-120px);
}

.letter h2{
    color:var(--pink1);
    margin-bottom:10px;
}

.tap-text{
    position:absolute;
    width:100%;
    bottom:-40px;
    text-align:center;
    color:white;
    font-size:14px;
}

/* Secret Page */

#secret-content{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:100;
    overflow-y:auto;
    padding:30px;
    animation:fade 1s;
}

@keyframes fade{
    from{opacity:0;}
    to{opacity:1;}
}

.title{
    color:white;
    font-size:2rem;
    margin-bottom:20px;
    text-align:center;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

/* Photo */

.photo-frame{
    width:230px;
    height:230px;
    padding:10px;
    background:white;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    transform:rotate(-3deg);
    margin-bottom:25px;
}

.photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:12px;
}

/* Typing Text */

#typing-text{
    max-width:350px;
    color:white;
    text-align:center;
    line-height:1.8;
    font-size:15px;
    min-height:180px;
}

/* Gallery */

.gallery{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-top:25px;
    padding-bottom:10px;
    max-width:90%;
}

.gallery img{
    width:120px;
    height:150px;
    object-fit:cover;
    border-radius:15px;
    border:3px solid white;
}

/* Button */

.btn{
    margin-top:30px;
    border:none;
    padding:12px 28px;
    border-radius:30px;
    font-weight:600;
    background:white;
    color:var(--pink1);
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.07);
}

/* Scrollbar */

.gallery::-webkit-scrollbar{
    height:5px;
}

.gallery::-webkit-scrollbar-thumb{
    background:white;
    border-radius:10px;
}

</style>
</head>
<body>

<!-- MUSIC -->
<audio id="bg-music" loop>
    <source src="lagu.mp3" type="audio/mpeg">
</audio>

<!-- HEARTS -->
<div id="heart-bg"></div>

<!-- ENVELOPE -->
<div class="envelope-wrapper" id="envelope">

    <div class="letter">
        <h2>Untuk Mela 💌</h2>
        <p>Klik lagi buat buka isi hati aku ✨</p>
    </div>

    <div class="tap-text">
        tap amplopnya sayang 🤍
    </div>

</div>

<!-- SECRET CONTENT -->
<div id="secret-content">

    <h1 class="title">
        Happy Level Up Sayangku 🎂
    </h1>

    <div class="photo-frame">
        <img src="IMG-20260407-WA0017.jpg">
    </div>

    <p id="typing-text"></p>

    <!-- Gallery -->
    <div class="gallery">
        <img src="IMG-20260407-WA0017.jpg">
        <img src="foto2.jpg">
        <img src="foto3.jpg">
        <img src="foto4.jpg">
    </div>

    <button class="btn" onclick="location.reload()">
        Ulangi Lagi 💞
    </button>

</div>

<!-- CONFETTI -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* Floating Hearts */

function createHeart(){

    const heart = document.createElement('div');

    heart.classList.add('heart');

    const emojis = ['💗','💖','💕','💞'];

    heart.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];

    heart.style.left = Math.random()*100 + 'vw';

    heart.style.fontSize = Math.random()*20 + 15 + 'px';

    heart.style.animationDuration = Math.random()*3 + 3 + 's';

    document.getElementById('heart-bg').appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },6000);

}

setInterval(createHeart,250);

/* Envelope Logic */

const envelope = document.getElementById('envelope');

let opened = false;

envelope.addEventListener('click',()=>{

    /* Play Music */

    document.getElementById('bg-music').play();

    if(!opened){

        envelope.classList.add('open');

        opened = true;

    }else{

        document.getElementById('secret-content').style.display='flex';

        startTyping();

        confetti({
            particleCount:250,
            spread:120,
            origin:{y:0.6}
        });

    }

});

/* Typing Effect */

const message = `
Happy level up sayangku cintaku 💞

Ga kerasa ya sekarang kamu udah 21.
Makasih udah bertahan sejauh ini,
udah jadi orang baik buat banyak orang,
dan udah hadir di hidup aku.

Aku harap di umur yang baru ini,
hal-hal baik makin sering dateng ke kamu.
Semoga semua yang kamu cari pelan-pelan ketemu,
dan semua sedih yang pernah lewat bisa terganti
sama bahagia yang lebih besar.

Please keep smiling,
because your smile still becomes
one of my favorite things in this world 🤍
`;

let i = 0;

function startTyping(){

    const typingText = document.getElementById('typing-text');

    function typing(){

        if(i < message.length){

            typingText.innerHTML += message.charAt(i);

            i++;

            setTimeout(typing,35);

        }

    }

    typing();

}

</script>

</body>
</html>
